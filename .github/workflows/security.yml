name: Security Checks

on:
  push:


permissions: {}

jobs:
  secrets:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMITS: ${{ toJson(github.event.commits) }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$EVENT_NAME" == "push" ]; then
            echo "depth=$(($(jq length <<< "$EVENT_COMMITS") + 2))" >> $GITHUB_ENV
            printf "branch=%s\n" "$REF_NAME" >> $GITHUB_ENV
          fi
          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "depth=$(($PR_COMMITS+2))" >> $GITHUB_ENV
            printf "branch=%s\n" "$HEAD_REF" >> $GITHUB_ENV
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{env.branch}}
          fetch-depth: ${{env.depth}}
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9