name: OpenVINO - IR Stability Test (OpenVINO nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
  pull_request:
    branches:
      - main
      - v*-release
    paths:
      - tests/openvino/test_irs.py
      - tests/openvino/utils_tests.py
      - .github/workflows/test_openvino_irs_nightly.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_TORCH_BACKEND: cpu
  UV_SYSTEM_PYTHON: true
  TRANSFORMERS_IS_CI: true
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install .[tests,diffusers] librosa

      - name: Install OpenVINO nightly
        run: |
          pip install --pre -U "openvino>=2026.5.dev0,<2026.5a0" --extra-index-url=https://storage.openvinotoolkit.org/simple/wheels/nightly

      - name: Report installed versions
        run: |
          python -c "import openvino, transformers; print('openvino', openvino.__version__); print('transformers', transformers.__version__)"

      - name: Restore HF models cache
        id: hf-cache-restore
        if: env.HF_TOKEN == ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models

      - name: Login with fork PRs CI token
        if: ${{ env.HF_TOKEN == '' }}
        run: |
          python tests/scripts/login_with_ci_token.py

      - name: Test with Pytest
        run: |
          pytest tests/openvino/test_irs.py --durations=0 -rs
