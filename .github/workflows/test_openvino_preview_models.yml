name: Preview Models Support Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v*-release
  pull_request:
    branches:
      - main
      - v*-release

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


env:
  UV_TORCH_BACKEND: cpu
  UV_SYSTEM_PYTHON: true
  TRANSFORMERS_IS_CI: true
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test-pattern:
          [
            "*export*",
            "*seq2seq*",
            "*transformation*",
          ]

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install .[tests] librosa

      - name: Login with fork PRs CI token
        if: ${{ env.HF_TOKEN == '' }}
        run: |
          python tests/scripts/login_with_ci_token.py

      - name: Install latest openvino nightly
        run: |
          uv pip install --pre -U openvino openvino-tokenizers openvino-genai --extra-index-url https://storage.openvinotoolkit.org/simple/wheels/nightly

      - name: Qwen3.5 Compressed-Tensors Validation
        if: ${{ matrix.test-pattern == '*export*' || matrix.test-pattern == '*seq2seq*' }}
        run: |
          uv pip install compressed-tensors
          pytest tests/openvino/${{ matrix.test-pattern }} -k qwen3_5_compressed_tensors --durations=0
          uv pip uninstall compressed-tensors

      - name: MiniCPM-V-4.7 Validation
        run: |
          uv pip install "transformers>=5.18"
          pytest tests/openvino/${{ matrix.test-pattern }} -k "minicpmv4_7" --durations=0

      # test_quantization, test_cb_compatible and test_dflash are not matched by the matrix test-pattern glob, so run
      # them explicitly and only once (the export job).
      - name: MiniCPM-V-4.7 Quantization, Continuous Batching and DFlash Validation
        if: ${{ matrix.test-pattern == '*export*' }}
        run: |
          uv pip install "transformers>=5.18"
          pytest tests/openvino/test_quantization.py tests/openvino/test_cb_compatible.py tests/openvino/test_dflash.py -k "minicpmv4_7" --durations=0

      - name: MiniCPM-OCR Validation
        run: |
          uv pip install "transformers>=5.21"
          pytest tests/openvino/${{ matrix.test-pattern }} -k "minicpm_ocr" --durations=0

      - name: MiniCPM-OCR Quantization and Continuous Batching Validation
        if: ${{ matrix.test-pattern == '*export*' }}
        run: |
          uv pip install "transformers>=5.21"
          pytest tests/openvino/test_quantization.py tests/openvino/test_cb_compatible.py -k "minicpm_ocr" --durations=0

      # The DSpark tests use a tiny Qwen3 DSpark draft. test_genai runs it with continuous batching against the
      # nightly GenAI installed above, which only uses the Markov head once it supports DSpark.
      - name: DSpark Export and Continuous Batching Validation
        if: ${{ matrix.test-pattern == '*export*' }}
        run: |
          uv pip install "transformers>=5.18"
          pytest tests/openvino/test_dflash.py tests/openvino/test_genai.py -k dspark --durations=0
