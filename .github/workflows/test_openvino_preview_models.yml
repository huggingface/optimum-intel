name: Preview Models Support Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v*-release
  pull_request:
    branches:
      - main
      - v*-release

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true


env:
  UV_TORCH_BACKEND: cpu
  UV_SYSTEM_PYTHON: true
  TRANSFORMERS_IS_CI: true
  HF_TOKEN: ${{ secrets.HF_HUB_READ_TOKEN }}

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test-pattern:
          [
            "*export*",
            "*seq2seq*",
            "*dflash*",
            "*cb_compatible*",
          ]

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip uv
          uv pip install .[tests] librosa

      - name: Login with fork PRs CI token
        if: ${{ env.HF_TOKEN == '' }}
        run: |
          python tests/scripts/login_with_ci_token.py

      - name: Install latest openvino nightly
        run: |
          uv pip install --pre -U openvino openvino-tokenizers openvino-genai --extra-index-url https://storage.openvinotoolkit.org/simple/wheels/nightly

      - name: DFlash Validation
        if: ${{ matrix.test-pattern == '*dflash*' }}
        run: |
          pytest tests/openvino/${{ matrix.test-pattern }} --durations=0

      # qwen3_asr and qwen3_tts need qwen-asr / qwen-tts (pinned transformers), so they run in the remote code workflow
      - name: Continuous Batching Compatibility Validation
        if: ${{ matrix.test-pattern == '*cb_compatible*' }}
        run: |
          pytest tests/openvino/${{ matrix.test-pattern }} -k "not (qwen3_asr or qwen3_tts)" --durations=0

      - name: Qwen3.5 Compressed-Tensors Validation
        if: ${{ matrix.test-pattern == '*export*' || matrix.test-pattern == '*seq2seq*' }}
        run: |
          uv pip install compressed-tensors
          pytest tests/openvino/${{ matrix.test-pattern }} -k qwen3_5_compressed_tensors --durations=0
          uv pip uninstall compressed-tensors

      - name: Scoped Config Validation with NNCF develop
        if: ${{ matrix.test-pattern != '*dflash*' && matrix.test-pattern != '*cb_compatible*' }}
        run: |
          uv pip install "nncf @ git+https://github.com/openvinotoolkit/nncf.git@develop"
          pytest tests/openvino/test_quantization.py -k "scoped_config" --durations=0

      # The DSpark tests use the tiny MiniCPM-V 4.7 DSpark draft. test_genai runs single-request speculative decoding
      # with it and the tiny MiniCPM-V 4.7 target against the nightly GenAI installed above, which runs it as a plain
      # DFlash draft until it supports DSpark.
      - name: DSpark Export and GenAI Speculative Decoding Validation
        if: ${{ matrix.test-pattern == '*export*' }}
        run: |
          pytest tests/openvino/test_exporters_cli.py tests/openvino/test_dflash.py tests/openvino/test_genai.py -k dspark --durations=0
